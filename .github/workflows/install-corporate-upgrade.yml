name: Install CRÈME Corporate Inquiry Upgrade
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply corporate inquiry upgrade
        shell: bash
        run: |
          set -euo pipefail
          archive="creme-corporate-upgrade.zip"
          test -f "$archive" || { echo "Upload creme-corporate-upgrade.zip to repository root first"; exit 1; }
          mkdir -p /tmp/creme-upgrade
          unzip -q "$archive" -d /tmp/creme-upgrade
          for path in \
            app/corporate/request/page.tsx \
            app/corporate/request/request-form.tsx \
            app/corporate/request/request.css \
            app/corporate/page.tsx \
            app/api/quote/route.ts \
            app/quote/quote-form.tsx; do
            test -f "/tmp/creme-upgrade/$path" || { echo "Missing file: $path"; exit 1; }
          done
          cp -a /tmp/creme-upgrade/app/. app/
          rm "$archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app "$archive"
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade CRÈME corporate inquiry and sourcing forms"
            git push
          fi
